version: 2

models:
  - name: int_customer_orders
    description: Order activity aggregated per customer.
    columns:
      - name: customer_id
        description: Primary key — one row per customer.
        tests:
          - unique
          - not_null
      - name: first_ordered_at
        description: Date of the customer's first order.
        tests:
          - not_null
      - name: most_recent_ordered_at
        description: Date of the customer's most recent order.
        tests:
          - not_null
      - name: number_of_orders
        description: Total number of orders placed by the customer.
        tests:
          - not_null

  - name: int_customer_payments
    description: Total payment amounts aggregated per customer.
    columns:
      - name: customer_id
        description: Primary key — one row per customer.
        tests:
          - unique
          - not_null
      - name: total_amount
        description: Total amount paid across all orders, in dollars.
        tests:
          - not_null

  - name: int_monthly_revenue_by_payment_method
    description: Revenue aggregated by calendar month and payment method. One row per month per payment method.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - month_start
              - payment_method
    columns:
      - name: month_start
        description: First day of the calendar month (date truncated to month).
        tests:
          - not_null
      - name: payment_method
        description: Payment method for this row — one of credit_card, coupon, bank_transfer, gift_card.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['credit_card', 'coupon', 'bank_transfer', 'gift_card']
      - name: revenue
        description: Total revenue for this payment method in this month, in dollars.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: int_order_payments
    description: Payment amounts pivoted by payment method per order.
    columns:
      - name: order_id
        description: Primary key — one row per order.
        tests:
          - unique
          - not_null
      - name: credit_card_amount
        description: Amount paid by credit card, in dollars.
        tests:
          - not_null
      - name: coupon_amount
        description: Amount paid by coupon, in dollars.
        tests:
          - not_null
      - name: bank_transfer_amount
        description: Amount paid by bank transfer, in dollars.
        tests:
          - not_null
      - name: gift_card_amount
        description: Amount paid by gift card, in dollars.
        tests:
          - not_null
      - name: total_amount
        description: Total amount paid across all payment methods, in dollars.
        tests:
          - not_null
